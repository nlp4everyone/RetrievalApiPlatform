name: retrieval_engine
services:
  mlflow:
    build:
      context: ..
      dockerfile: docker/Dockerfile_mlflow
    image: mlflow_psycopg2
    container_name: mlflow
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    environment:
      # Require database mlflow for using
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      # S3 for artifact storage
      MLFLOW_DEFAULT_ARTIFACT_ROOT: ${MLFLOW_DEFAULT_ARTIFACT_ROOT:-s3://mlflow/artifacts}
      # Create experiment if not existed
      MLFLOW_EXPERIMENT_NAME : ${MLFLOW_EXPERIMENT_NAME:-Experiment}
      # Authentication information
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      # AWS secret key for Minio
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      # AWS region for S3 compatibility
      AWS_REGION: us-east-1
      # Minio endpoint URL for S3
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:-http://minio:9000}
      # MLflow tracking server URI
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      # Enable async logging for better performance
      MLFLOW_ENABLE_ASYNC_LOGGING: True
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      --default-artifact-root ${MLFLOW_DEFAULT_ARTIFACT_ROOT:-s3://mlflow/artifacts}
      --host 0.0.0.0
      --port 5000
      --allowed-hosts '*'
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: minio
    environment:
      # Minio root user for authentication
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      # Minio root password for authentication
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  minio_data:
