services:
  web:
    container_name: web_service
    restart: always
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      - DISABLE_UVICORN_PROPAGATION=true
      - NUM_WORKERS=${NUM_WORKERS:-1}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    ports:
      - "${FASTAPI_PORT:-8005}:8005"
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_started
    command: >
      uv run uvicorn app.app:app
      --host 0.0.0.0
      --port 8005
      --workers ${NUM_WORKERS:-1}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: taskiq_worker
    restart: always
    command: uv run taskiq worker taskiq_worker:broker
    environment:
      REDIS_URL: redis://redis:${REDIS_PORT:-6379}/0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GIT_PYTHON_REFRESH: "quiet"
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
