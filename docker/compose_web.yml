services:
  web:
    container_name: web_service
    restart: always
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      - NUM_WORKERS=${NUM_WORKERS:-1}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    ports:
      - "${FASTAPI_PORT:-8005}:8005"
    # The vector store is external, reached over QDRANT_URL - nothing to depend on.
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_healthy
    command: >
      uv run uvicorn app.app:app
      --host 0.0.0.0
      --port 8005
      --workers ${NUM_WORKERS:-1}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: taskiq_worker
    restart: always
    # --max-async-tasks is the memory bound, not a throughput knob: every task
    # in flight holds its whole file in RAM (DownloadStage), plus the parsed
    # text and the chunks. TaskIQ's default is high enough that a handful of
    # 100MB uploads would OOM this container against the 4g limit below.
    command: uv run taskiq worker app.tasks.broker:broker --max-async-tasks ${WORKER_MAX_ASYNC_TASKS:-8}
    environment:
      REDIS_URL: redis://redis:${REDIS_PORT:-6379}/0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GIT_PYTHON_REFRESH: "quiet"
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # The worker has no HTTP surface, so this probes the two connections whose
    # loss leaves it up but idle: Redis, where tasks arrive from, and Postgres,
    # where every job records its outcome. A hung task is not covered - the
    # broker's own xautoclaim reclaims those after idle_timeout.
    healthcheck:
      test: ["CMD", "/workspace/.venv/bin/python", "/workspace/docker/worker_healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
